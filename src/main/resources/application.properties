4. Configuración profesional de application.properties
Abre el archivo src/main/resources/application.properties. Actualmente tiene pocas líneas. Vamos a reemplazarlo con una configuración completa y documentada.

Reemplaza todo el contenido del archivo con lo siguiente:

# ═══════════════════════════════════════════════════════════
# INFORMACIÓN DE LA APLICACIÓN
# ═══════════════════════════════════════════════════════════
spring.application.name=cliente-service
app.version=0.2.0
api.version=v1

# ═══════════════════════════════════════════════════════════
# SERVIDOR WEB
# ═══════════════════════════════════════════════════════════
server.port=8080

# ═══════════════════════════════════════════════════════════
# BASE DE DATOS — PostgreSQL
# ═══════════════════════════════════════════════════════════
spring.datasource.url=jdbc:postgresql://localhost:5432/curso_springboot
spring.datasource.username=devdb
spring.datasource.password=a1b2c3d4
spring.datasource.driver-class-name=org.postgresql.Driver

# ═══════════════════════════════════════════════════════════
# POOL DE CONEXIONES — HikariCP
# ═══════════════════════════════════════════════════════════
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ClienteHikariPool
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000

# ═══════════════════════════════════════════════════════════
# JPA / HIBERNATE
# ═══════════════════════════════════════════════════════════
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ═══════════════════════════════════════════════════════════
# SPRING ACTUATOR
# ═══════════════════════════════════════════════════════════
management.server.port=8081
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ═══════════════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════════════
logging.level.com.denkitronik.clienteservice=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ═══════════════════════════════════════════════════════════
# CARGA DE ARCHIVOS (fotos de perfil)
# ═══════════════════════════════════════════════════════════
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
Spring Boot 4.0: propiedad renombrada
En Spring Boot 3.x se usa spring.jpa.database-platform para indicar el dialecto de Hibernate.
En Spring Boot 4.0 esta propiedad queda obsoleta — Hibernate 6.x detecta el dialecto automáticamente en la mayoría de los casos.

La tabla de opciones DDL
Esta es una de las decisiones más importantes al configurar JPA. Elige mal y puedes perder datos de producción:

Valor

Qué hace

Cuándo usarlo

create-drop

Crea tablas al arrancar, las borra al parar

Desarrollo y pruebas — datos descartables

update

Agrega columnas nuevas, nunca borra

Desarrollo avanzado — cuidado con cambios destructivos

validate

Verifica que el esquema coincida, falla si no

Staging/QA — con migraciones propias (Flyway, Liquibase)

none

No hace nada

Producción real — el DBA maneja el esquema

En este codelab usamos create-drop para que los datos de prueba se carguen desde cero en cada reinicio.